repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^poc/.*\.patch$
      - id: end-of-file-fixer
        exclude: ^poc/.*\.patch$
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt (format check)
        entry: bunx oxfmt --check
        language: system
        files: \.(ts|tsx|js|jsx|json|jsonc|css|md|ya?ml)$
        pass_filenames: true

      - id: oxlint
        name: oxlint
        entry: bunx oxlint
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: true

      - id: web-ext-lint
        name: web-ext lint (build + addons-linter)
        entry: bun run lint:ext
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: bun run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: test
        name: tests (bun test)
        entry: bun test
        language: system
        pass_filenames: false
        stages: [pre-push]
