repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt (format check)
        entry: bunx oxfmt --check
        language: system
        files: \.(ts|tsx|js|jsx|json|jsonc|css|md|ya?ml)$
        pass_filenames: true

      - id: oxlint
        name: oxlint
        entry: bunx oxlint
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: true
