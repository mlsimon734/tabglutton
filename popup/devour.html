<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabglutton · Devour cockpit</title>
    <link rel="icon" href="../icons/icon-chomp.svg" />
    <link rel="stylesheet" href="devour.css" />
  </head>
  <body class="cockpit">
    <!-- The two chrome stacks float over the queue rather than boxing it in, so
         the list genuinely passes beneath them and the glass has something to
         refract. They stay in document order so keyboard focus still runs
         header → queue → actions. -->
    <div id="chrome-top" class="chrome chrome-top">
      <header class="cockpit-header">
        <div class="brand">
          <span id="logo-mark" class="logo-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <h1 class="title">Tabglutton</h1>
          </div>
        </div>

        <div class="header-search">
          <svg class="search-glyph" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path
              d="M10.4 10.4 13.5 13.5"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
          <input type="search" id="filter" placeholder="Filter URL or title" autocomplete="off" />
          <kbd class="search-hint" aria-hidden="true">/</kbd>
        </div>

        <div class="header-controls">
          <span id="selection-summary" class="selection-summary">0 of 0 chosen</span>
          <button id="select-all" type="button" class="select-toggle quiet">Select all</button>
          <button
            id="open-options"
            type="button"
            class="icon"
            title="Settings"
            aria-label="Settings"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                d="M3 4h10M3 8h10M3 12h10"
              />
              <circle cx="6" cy="4" r="1.5" fill="currentColor" />
              <circle cx="11" cy="8" r="1.5" fill="currentColor" />
              <circle cx="5" cy="12" r="1.5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <div id="warning" class="warning" hidden></div>
    </div>

    <main class="cockpit-main">
      <section class="queue" aria-label="Tab queue">
        <div id="empty" class="empty" hidden>
          <p id="empty-title">No tabs in scope.</p>
          <p id="empty-sub" class="muted"></p>
        </div>
        <ul id="groups"></ul>
      </section>

      <aside class="inspector" aria-label="Inspector">
        <div id="inspector-content"></div>
      </aside>
    </main>

    <div id="chrome-bottom" class="chrome chrome-bottom">
      <section id="devour-failures" class="devour-failures" hidden aria-live="polite">
        <header class="devour-failures-header">
          <span class="devour-failures-title">
            Devour failures
            <span id="devour-failures-count" class="count-badge danger">0</span>
          </span>
          <div class="devour-failures-actions">
            <button id="devour-retry-all" type="button">Retry all</button>
            <button id="devour-dismiss" type="button" class="quiet">Dismiss</button>
          </div>
        </header>
        <ul id="devour-failures-list" class="devour-failures-list"></ul>
      </section>

      <footer class="action-bar">
        <div class="action-cluster">
          <button
            id="clip-current"
            type="button"
            class="primary"
            disabled
            title="Devour selected tabs into Obsidian and close them"
          >
            <span class="primary-label">Devour</span>
            <span id="clip-count" class="count-badge" hidden>0</span>
          </button>
          <button id="copy-urls" type="button" disabled>Copy URLs</button>
          <button id="dedup" type="button" disabled title="Close duplicate tabs">
            Dedup
            <span id="dedup-count" class="count-badge" hidden>0</span>
          </button>
          <span class="action-divider" aria-hidden="true"></span>
          <button id="close-selected" type="button" class="danger" disabled>Close</button>
        </div>
        <div class="kbd-legend" aria-hidden="true">
          <span class="kbd-hint"><kbd>j</kbd><kbd>k</kbd>move</span>
          <span class="kbd-hint"><kbd>space</kbd>toggle</span>
          <span class="kbd-hint"><kbd>d</kbd>devour</span>
          <span class="kbd-hint"><kbd>x</kbd>close</span>
          <span class="kbd-hint"><kbd>/</kbd>filter</span>
        </div>
      </footer>
    </div>

    <div id="toast" class="toast" hidden role="status" aria-live="polite">
      <span id="toast-text"></span>
      <button id="toast-undo" type="button">Undo</button>
    </div>

    <script type="module" src="devour.js"></script>
  </body>
</html>
