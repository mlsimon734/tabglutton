<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Tabglutton</title>
  <!-- Monochrome wordmark mark: a page with a two-tooth bite chomped out of the -->
  <!-- right edge (two mask circles = a scalloped "munch" crescent), plus a faint -->
  <!-- second page behind for the "tab stack" hint. Pairs with icons/icon-chomp.svg. -->
  <defs>
    <mask id="tg-bite">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="51" cy="18" r="8.5" fill="#000" />
      <circle cx="51" cy="31" r="8.5" fill="#000" />
    </mask>
  </defs>
  <rect x="11" y="19" width="26" height="29" rx="5" fill="currentColor" opacity="0.35" />
  <rect x="12" y="12" width="36" height="36" rx="7" fill="currentColor" mask="url(#tg-bite)" />
</svg>
