<!--
  The app icon at toolbar sizes (16 and 32), where icon-chomp.svg turns to mush.

  Same mark, drawn for the size rather than scaled down to it. Two changes, both because a
  16px raster has roughly 12 usable pixels of glyph:

  - The chocolate chips are gone. At 16px each is a sub-pixel speck that does not read as a
    chip; it only lowers the contrast of the fill it sits in, which is the one thing keeping
    the silhouette legible. They come back at 48 and above.
  - The glyph is larger (44 units tall against 40), because dropping the interior detail is
    what buys the room, and presence is what a toolbar icon needs most.

  The silhouette and bite are identical to icons/logo-mark.svg and must stay that way —
  tests/logo-mark.test.ts pins all three copies together, and pins the missing chips here as
  deliberate rather than dropped.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <mask id="cookie-bite" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="47.5" cy="17" r="6.5" fill="#000" />
      <circle cx="44.5" cy="24" r="6.5" fill="#000" />
      <circle cx="44" cy="31" r="6.5" fill="#000" />
      <circle cx="49" cy="38" r="6.5" fill="#000" />
      <circle cx="52" cy="21" r="4.2" fill="#000" />
      <circle cx="52" cy="28" r="4.2" fill="#000" />
      <circle cx="53" cy="35" r="4.2" fill="#000" />
    </mask>
  </defs>

  <rect width="64" height="64" rx="12" fill="#7a4a2c" />

  <g transform="translate(3.3 0.435) scale(0.9565)">
    <path
      d="M12 56C9.8 56 8 54.2 8 52V20C8 18.3 9.3 17 11 17H13C16.5 17 16 10 19.5 10H26.5C30 10 29.5 17 33 17H50C51.1 17 52 17.9 52 19V52C52 54.2 50.2 56 48 56H12Z"
      fill="#f4efe6"
      mask="url(#cookie-bite)"
    />
  </g>
</svg>
