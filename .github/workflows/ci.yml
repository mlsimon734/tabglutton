name: ci

# Every action is pinned to a full commit SHA, with its release tag in the trailing
# comment. A mutable tag (`@v7`) is a standing code-execution grant to whoever can move
# it — the shape of the tj-actions/changed-files compromise. The comment is load-bearing,
# not decoration: Renovate reads the tag from it to offer updates, and disables any action
# pinned to a bare SHA with no comment.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Lint JS/TS (oxlint)
        run: bun run lint:js

      - name: Lint extension (web-ext)
        run: bun run lint:ext

      - name: Package
        run: bun run package

      - name: Package Gullet
        run: bun run package:gullet

      - name: Upload extension zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webext-zip
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
